<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HR Registration | JobNest</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <style>
    body {
      background-color: #f5f7fa;
    }
    .container {
      max-width: 500px;
      margin-top: 60px;
      background-color: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    .form-control:focus {
      box-shadow: none;
      border-color: #2648ff;
    }
    .btn-primary {
      background-color: #2648ff;
      border-color: #2648ff;
    }
    .btn-primary:hover {
      background-color: #1d38cc;
      border-color: #1d38cc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3 class="text-center mb-4">HR Registration</h3>
    <form id="hrRegForm" enctype="multipart/form-data">
      <div class="mb-3">
        <input type="text" class="form-control" name="name" placeholder="Full Name" required />
      </div>
      <div class="mb-3">
        <input type="email" class="form-control" name="email" placeholder="Email" required />
      </div>
      <div class="mb-3">
        <input type="text" class="form-control" name="hrId" placeholder="HR ID" required />
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" name="password" placeholder="Password" required />
      </div>
      <div class="mb-3">
        <input type="text" class="form-control" name="contact" placeholder="Contact Number" />
      </div>
      <div class="mb-3">
        <input type="text" class="form-control" name="company" placeholder="Company Name" />
      </div>
      <div class="mb-3">
        <input type="text" class="form-control" name="experience" placeholder="Experience (e.g. 2 years)" />
      </div>
      <div class="mb-3">
        <input type="text" class="form-control" name="bio" placeholder="About Me / Bio" />
      </div>
      <div class="mb-3">
        <label class="form-label">Upload Profile Picture</label>
        <input type="file" class="form-control" name="profilePic" accept="image/*" />
      </div>
      <button type="submit" class="btn btn-primary w-100">Register</button>
      <p class="mt-3 text-center">Already registered? <a href="/hr_login.html">Login here</a></p>
    </form>
  </div>

  <script>
    document.getElementById("hrRegForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const formData = new FormData(this);

      const res = await fetch("http://localhost:8080/api/hr/register", {
        method: "POST",
        body: formData,
      });

      const data = await res.json();
      if (res.ok) {
        alert("Registration successful!");
        window.location.href = "/hr_login.html";
      } else {
        alert(data.message || "Registration failed");
      }
    });
  </script>
</body>
</html>
